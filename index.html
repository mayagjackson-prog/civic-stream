<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Montclair Street Complaint Tracker</title>
<style>
    /* Styling the container to look like a modern widget */
    .widget-container {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 30px;
        border-radius: 12px;
        background-color: #ffffff;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    .widget-header {
        text-align: center;
        color: #1a5b3a; /* Montclair Green */
        margin-bottom: 25px;
    }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
    .form-group input, .form-group select, .form-group textarea {
        width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;
    }
    .submit-btn {
        width: 100%; padding: 15px; background-color: #1a5b3a; color: white;
        border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold;
    }
    .submit-btn:hover { background-color: #124028; }
    
    /* Progress Tracker Styling */
    .tracker-container { display: none; margin-top: 30px; }
    .progress-bar { display: flex; justify-content: space-between; position: relative; margin-bottom: 30px; }
    /* The line behind the circles */
    .progress-bar::before {
        content: ''; background-color: #eee; position: absolute;
        top: 15px; left: 0; height: 4px; width: 100%; z-index: 1;
    }
    .step { position: relative; z-index: 2; text-align: center; width: 20%; }
    .circle {
        background-color: #fff; border: 4px solid #eee; border-radius: 50%;
        height: 25px; width: 25px; display: inline-block; transition: 0.3s;
    }
    .step.active .circle { border-color: #1a5b3a; background-color: #1a5b3a; }
    .step-label { display: block; margin-top: 10px; font-size: 11px; color: #888; }
    .step.active .step-label { color: #1a5b3a; font-weight: bold; }
</style>
</head>
<body>

<div class="widget-container">
    <div id="submission-section">
        <h2 class="widget-header">CivicStream: Report an Issue</h2>
        <form id="complaint-form">
            <div class="form-group">
                <label for="issue-type">Issue Type</label>
                <select id="issue-type" required>
                    <option value="">Select an issue...</option>
                    <option value="pothole">Pothole</option>
                    <option value="speeding">Speeding / Traffic Calming</option>
                    <option value="crosswalk">Faded Crosswalk</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" placeholder="e.g. Grove and Elm" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" rows="3" required></textarea>
            </div>
            <button type="submit" class="submit-btn" id="submit-btn">Submit Report</button>
        </form>
    </div>

    <div id="tracker-section" class="tracker-container">
        <h3 style="text-align:center">Ticket #<span id="ticket-id"></span></h3>
        <div class="progress-bar">
            <div class="step" id="step-1"><div class="circle"></div><span class="step-label">Submitted</span></div>
            <div class="step" id="step-2"><div class="circle"></div><span class="step-label">Review</span></div>
            <div class="step" id="step-3"><div class="circle"></div><span class="step-label">Engineering</span></div>
            <div class="step" id="step-4"><div class="circle"></div><span class="step-label">Scheduled</span></div>
            <div class="step" id="step-5"><div class="circle"></div><span class="step-label">Done</span></div>
        </div>
        <p style="text-align: center;" id="status-message">Processing your request...</p>
    </div>
</div>

<script>
    // This is where the data is sent (Maya's Google Sheet script)
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwwIPftdQmUixIZGRPPEi5RYJ0-UPVLKtxOlkE_g_B-JqtgHHAQ6IRD-IsfoUnqeglw/exec'; 

    document.getElementById('complaint-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submit-btn');
        btn.innerText = "Sending...";
        btn.disabled = true;

        const formData = new FormData();
        formData.append('issueType', document.getElementById('issue-type').value);
        formData.append('location', document.getElementById('location').value);
        formData.append('description', document.getElementById('description').value);

        fetch(scriptURL, { method: 'POST', body: formData })
            .then(response => response.json())
            .then(data => {
                // Hide Form, Show Tracker
                document.getElementById('submission-section').style.display = 'none';
                document.getElementById('tracker-section').style.display = 'block';
                
                // Show the actual Ticket ID from the database
                document.getElementById('ticket-id').innerText = data.ticketId || "Pending";
                updateTracker(1, "Your report is now logged with the Township!");
            })
            .catch(error => {
                console.error('Error!', error);
                // Fallback for demo if the URL is not "Live" yet
                document.getElementById('submission-section').style.display = 'none';
                document.getElementById('tracker-section').style.display = 'block';
                document.getElementById('ticket-id').innerText = "DEMO-123";
                updateTracker(1, "Demo Mode: Report received (Backend not connected).");
            });
    });

    function updateTracker(stepNumber, message) {
        for (let i = 1; i <= stepNumber; i++) {
            document.getElementById('step-' + i).classList.add('active');
        }
        document.getElementById('status-message').innerText = message;
    }
</script>
</body>
</html>
